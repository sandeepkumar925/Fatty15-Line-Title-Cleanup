# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a65fb4077e39ee33e15375f48b590470"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true
name = "Fatty15 Line Title Cleanup"

[webhooks]
api_version = "2027-01"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# The app page lists products (read_products) with a field per store language (read_locales) and saves
# the title for every market (read_markets, read/write_translations: market adaptations).
scopes = "read_products,read_locales,read_markets,read_translations,write_translations"

# The app page (extensions/app-home) calls the Admin API directly.
[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
automatically_update_urls_on_dev = true
